# Вставьте вместо существующего блока «location / { ... }» в конфигурации сайта nginx
# (обычно /etc/nginx/sites-enabled/default или /etc/nginx/conf.d/*.conf).
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    # Мгновенная рассылка изменений (Server-Sent Events): без буферизации и с долгим ожиданием
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 20m;
}
