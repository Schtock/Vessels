    leg((x, y0) => `<rect x="${x}" y="${y0 + 3}" width="20" height="8" rx="2" fill="${legShip}"/>`, 'Переход (цвет судна)');
    leg((x, y0) => `<rect x="${x}" y="${y0}" width="20" height="14" rx="2" fill="${hatch(COLORS.load)}" stroke="${COLORS.load}"/>`, 'Запас (штриховка цвета операции)');
    leg((x, y0) => `<path d="M${x + 10} ${y0 - 1} l8 8 l-8 8 l-8 -8 z" fill="#fff" stroke="${legShip}" stroke-width="2"/>`, 'Заход без операций');
    leg((x, y0) => `<line x1="${x}" y1="${y0 + 7}" x2="${x + 20}" y2="${y0 + 7}" stroke="#e03131" stroke-width="2"/>`, 'Сегодня');
    leg((x, y0) => `<line x1="${x}" y1="${y0 + 7}" x2="${x + 20}" y2="${y0 + 7}" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3"/>`, 'Дедлайн');
    if (anyViolation) leg((x, y0) => `<rect x="${x + 1}" y="${y0}" width="18" height="14" rx="3" fill="none" stroke="#e03131" stroke-width="2.5"/>`, 'Нарушение срока');
    const Wf = Math.max(W, lx + 10);

    lastSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Wf}" height="${H}" viewBox="0 0 ${Wf} ${H}"><defs>${[...patterns.values()].join('')}</defs>${out.join('')}</svg>`;
    lastSize = { w: Wf, h: H };
    chartGeom = { X, labelW };
    const wrap = $('#chartWrap');
    const keep = wrap.scrollLeft;
    $('#chart').style.width = Wf + 'px';
    $('#chart').innerHTML = `<svg class="sticky-labels" xmlns="http://www.w3.org/2000/svg" width="${labelW}" height="${bodyBottom}" style="margin-bottom:-${bodyBottom}px">${lab.join('')}</svg>` + lastSvg;
    wrap.scrollLeft = keep;
    if (scrollToday) scrollToToday();
  }

  function scrollToToday() {
    if (!chartGeom) return;
    $('#chartWrap').scrollLeft = Math.max(0, chartGeom.X(Date.now()) - chartGeom.labelW - 120);
  }

  // Подсказки при наведении
  const tipEl = $('#tooltip');
  $('#chart').addEventListener('mousemove', e => {
    const g = e.target.closest('[data-tip]');
    if (!g) { tipEl.style.display = 'none'; return; }
    const tp = tips[+g.dataset.tip]; if (!tp) return;
    tipEl.innerHTML = `<b>${esc(tp.title)}</b><br>${tp.lines.map(esc).join('<br>')}`;
    tipEl.style.display = 'block';
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  });
  $('#chart').addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
  $('#chart').addEventListener('click', e => {
    const g = e.target.closest('[data-tip]'); if (!g) return;
    const tp = tips[+g.dataset.tip];
    if (tp && tp.vid) { state.settings.sel = tp.vid; state.settings.tab = 'voyage'; save(); renderAll(); }
  });

  function exportPng() {
    if (state.settings.mainTab === 'costs') { state.settings.mainTab = 'chart'; save(); renderAll(); }
    if (!lastSvg) return;
    const img = new Image();
    img.onload = () => {
      const k = Math.min(2, 16000 / lastSize.w, 16000 / lastSize.h);
      const cv = document.createElement('canvas');
      cv.width = Math.round(lastSize.w * k); cv.height = Math.round(lastSize.h * k);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.scale(k, k); ctx.drawImage(img, 0, 0);
      cv.toBlob(b => download(b, `voyages_gantt_${isoDate(Date.now())}.png`), 'image/png');
    };
    img.onerror = () => alert('Не удалось сформировать PNG');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSvg);
  }

  /* ================= Таблица рейса ================= */
  function renderTable() {
    if (state.settings.mainTab === 'costs') return;
    const sec = $('#tableSection');
    const v = selVoyage();
    if (!v) { sec.innerHTML = '<p class="hint">Выберите или создайте рейс, чтобы увидеть таблицу этапов.</p>'; return; }
    const c = computeVoyage(v);
    const ship = shipById(v.shipId);
    const sc = ship ? ship.color : '#868e96';
    const sw = s => {
      if (s.type === 'transit') return `<span class="sw" style="background:${sc};height:7px;vertical-align:2px"></span>`;
      if (s.type === 'load' || s.type === 'unload') return `<span class="sw" style="background:${COLORS[s.type]}"></span>`;
      if (s.type === 'reserve') { const col = COLORS[s.colorOf] || sc; return `<span class="sw" style="background:repeating-linear-gradient(45deg,${col} 0 2px,${tint(col, .8)} 2px 5px);border:1px solid ${col}"></span>`; }
      return `<span class="sw" style="background:#fff;border:2px solid ${sc};transform:rotate(45deg);width:10px;height:10px;margin-left:2px"></span>`;
    };
    const rows = c.segs.map((s, i) => `<tr>
      <td>${i + 1}</td>
      <td>${sw(s)}${STAGE[s.type]}${s.cranes ? ' <span class="muted">(судовые краны)</span>' : ''}</td>
      <td>${esc(s.place)}</td>
      <td>${fmtDT(s.start)}</td>
      <td>${fmtDT(s.end)}</td>
      <td class="r">${fmtNum(s.days)}</td>
      <td class="r">${fmtHours(s.days)}</td></tr>`).join('');
    sec.innerHTML = `<h2>${esc(v.name || 'Рейс')}</h2>
      <div class="muted" style="margin-bottom:8px">Судно: <b>${esc(ship ? ship.name : '—')}</b> · начало ${fmtDT(c.start)} · окончание ${fmtDT(c.end)}</div>
      <div class="scroll-x">
      <table class="grid">
        <thead><tr><th>№</th><th>Этап</th><th>Порт / участок</th><th>Начало</th><th>Окончание</th><th class="r">Длительность, сут.</th><th class="r">Часы</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="muted">Маршрут пуст</td></tr>'}</tbody>
        <tfoot>
          <tr><td></td><td colspan="2">Итого по рейсу</td><td>${fmtDT(c.start)}</td><td>${fmtDT(c.end)}</td><td class="r">${fmtNum(c.days)}</td><td class="r">${fmtHours(c.days)}</td></tr>
          <tr><td></td><td colspan="6" class="muted" style="font-weight:400">в т.ч. в пути ${fmtDays(c.totals.transit)} · грузовые операции ${fmtDays(c.totals.ops)} · запас ${fmtDays(c.totals.reserve)}</td></tr>
        </tfoot>
      </table></div>${checksHtml(c)}`;
  }

  function setPrintTitle() {
    $('#printTitle').textContent = (state.settings.mainTab === 'costs' ? 'Расходы по тайм-чартеру — ' : 'План рейсов судов — ') + fmtDT(Date.now());
  }

  function renderAll(scrollToday) {
    const mt = state.settings.mainTab === 'costs' ? 'costs' : 'chart';
    document.querySelectorAll('#mainTabs button').forEach(b => b.classList.toggle('active', b.dataset.t === mt));
    $('#viewChart').hidden = mt !== 'chart';
    $('#viewCosts').hidden = mt !== 'costs';
    renderSidebar();
    renderChart(scrollToday);
    renderTable();
    renderCosts();
  }

  // Синхронизация между вкладками браузера
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try { state = normalize(JSON.parse(e.newValue)); applySizes(); renderAll(); } catch (_) { }
  });
  window.addEventListener('beforeprint', setPrintTitle);
  window.addEventListener('pagehide', save);

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) { }
  applySizes();
  save();
  renderAll(true);
  restoreFileHandle();
})();
</script>
</body>
</html>
